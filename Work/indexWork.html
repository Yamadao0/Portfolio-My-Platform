<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styleWork.css">
</head>
<body>
<!---------------------------------------------------------------------------------------------------------------------------->
<!-- НАВБАР -->
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <button class="homepage" onclick="window.location.href='../Main page/index.html'">
                    <img src="LOGO.png" class="logoPNG" alt="Logo" />
                    <div class="logo">MySite</div>
                </button>
            </div>

            <ul class="nav-links">
                <li><a href="../About me/AboutMe.html">About me</a></li>
                <li><a href="../Work/indexWork.html" class="active">Work</a></li>
                <li><a href="https://wa.me/87013096484">Contact</a></li>
            </ul>
        </nav>
    </header>
<!---------------------------------------------------------------------------------------------------------------------------->
<!-- КОНТАКТНЫЕ ИКОНКИ -->
    <div class="contact-icons">
        <a href="https://github.com/Yamadao0" target="_blank" class="icon-btn"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/aslan-khabulov-6a3693400/" target="_blank" class="icon-btn"><i class="fab fa-linkedin"></i></a>
        <a href="https://www.instagram.com/aslan_khabulov/" target="_blank" class="icon-btn"><i class="fab fa-instagram"></i></a>
    </div>
<!---------------------------------------------------------------------------------------------------------------------------->
<!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="work-wrapper">
        <div id="portfolio-list" class="work-container">
            <div class="glass-box work-card">
                <h3>Project Title</h3>
                <p>Ваше описание проекта здесь. Это выглядит как плавный баббл.</p>
            </div>
        </div>
    </main>

    <button id="open-modal" class="add-work-btn">+</button>

<!---------------------------------------------------------------------------------------------------------------------------->
<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modal" class="modal-overlay">
    <div class="glass-box modal-content active">
        <h3>New Project</h3>
        
        <div class="modal-inputs">
            <input type="text" id="work-title" placeholder="Project Name" class="input-field">
            <textarea id="work-desc" placeholder="Description" class="input-field"></textarea>
            
            <div class="upload-area">
                <input type="file" id="work-file" accept="image/*,video/*" class="file-input" hidden>
                <button type="button" class="upload-btn" onclick="document.getElementById('work-file').click();">
                    <i class="fas fa-file-upload"></i> Upload Image / Video
                </button>
                <p id="file-name" class="file-info">No file selected</p>
            </div>
        </div>

        <div class="modal-btns">
            <button onclick="closeModal()" class="btn-cancel">Cancel</button>
            <button onclick="saveWork()" class="btn-save">Add</button>
        </div>
    </div>
</div>
<!---------------------------------------------------------------------------------------------------------------------------->
<script src="ScriptWork.js"></script>
<!---------------------------------------------------------------------------------------------------------------------------->
</body>
</html>
